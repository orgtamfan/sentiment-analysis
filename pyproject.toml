[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reddit-game-sentiment"
version = "0.1.0"
description = "Baseline Naive Bayes sentiment analysis for CS2 and VALORANT Reddit communities"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = ["src"]

